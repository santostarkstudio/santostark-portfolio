        // Bulletproof scroll-to-section
        window.starkScrollTo = function(targetId) {
          const el = document.getElementById(targetId);
          if (!el) return;
          const navOffset = 75;
          const scrollNow = function() {
            const rect = el.getBoundingClientRect();
            const topY = rect.top + window.pageYOffset - navOffset;
            window.scrollTo({ top: Math.max(0, topY), behavior: 'smooth' });
          };
          scrollNow();
          setTimeout(scrollNow, 150);
          setTimeout(scrollNow, 400);
        };
      })();
    </script>

    <script>
      (function() {
        // Scroll-driven crossfade
        let ticking = false;
        function updateVideoCrossfade() {
          const videoContainer = document.getElementById('orbital-video-container');
          if (!videoContainer) return;
          const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          const homeEl = document.getElementById('home');
          const heroHeight = (homeEl && homeEl.offsetHeight) ? homeEl.offsetHeight : window.innerHeight;
          const transitionDist = Math.max(300, heroHeight * 0.75);
          const p = Math.min(1, Math.max(0, scrollY / transitionDist));
          const smooth = p * p * (3 - 2 * p);
          const currentOpacity = 0.22 + (smooth * 0.38);
          videoContainer.style.opacity = currentOpacity.toFixed(3);
          videoContainer.style.transform = 'scale(' + (1.03 - smooth * 0.03).toFixed(3) + ')';
          if (homeEl) {
            const canvasEl = homeEl.querySelector('canvas') || homeEl.querySelector('.pointer-events-auto');
            if (canvasEl) {
              const canvasScale = 1 + smooth * 0.35;
              const canvasOpacity = Math.max(0, 1 - smooth * 1.1);
              canvasEl.style.transform = 'scale(' + canvasScale.toFixed(3) + ')';
              canvasEl.style.opacity = canvasOpacity.toFixed(3);
            }
          }
        }
        window.addEventListener('scroll', function() {
          if (!ticking) {
            window.requestAnimationFrame(function() { updateVideoCrossfade(); ticking = false; });
            ticking = true;
          }
        }, { passive: true });
        window.addEventListener('resize', updateVideoCrossfade, { passive: true });
        updateVideoCrossfade();
      })();
    </script>
