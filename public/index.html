    <title>Santo Stark Studio | Systems Developer</title>
    <meta name="description" content="Santo Stark Studio featuring 3D Real Space Solar System, IoT/Cloud projects, skills matrix, and interactive experiences." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <body class="bg-[#090a0f] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden touch-manipulation">
    
    
    <!-- 4K Space Video Backdrop -->
    <div id="orbital-video-container" style="position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; opacity: 0.35; will-change: opacity, transform;">
      <video id="orbital-bg-video" autoplay loop muted playsinline preload="auto" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: brightness(0.68) contrast(1.35) saturate(1.15);">
        <source src="/bg-video.mp4" type="video/mp4" />
      </video>
      
      <!-- Obsidian Shield (40% darkness so 4K video shines brightly while text remains 100% readable) -->
      <div style="position: absolute; inset: 0; background: rgba(5, 7, 10, 0.65);"></div><div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.1) 20%, rgba(5, 7, 10, 0.85) 90%);"></div>
      
      <!-- Seamless Edge Feathering -->
      <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, #090a0f 0%, transparent 15%, transparent 85%, #090a0f 100%);"></div>
    </div>

    <div id="root" style="position: relative; z-index: 10; background: transparent;"></div>

    <script>
      (function() {
        // Bulletproof scroll-to-section with multi-interval layout stabilization
        window.starkScrollTo = function(targetId) {
          const el = document.getElementById(targetId);
          if (!el) return;
          const navOffset = 75;
          const scrollNow = function() {
            const rect = el.getBoundingClientRect();
            const topY = rect.top + window.pageYOffset - navOffset;
            window.scrollTo({ top: Math.max(0, topY), behavior: 'smooth' });
          };
          scrollNow();
          setTimeout(scrollNow, 250);
          setTimeout(scrollNow, 600);
          setTimeout(scrollNow, 1100);
        };

        const videoContainer = document.getElementById('orbital-video-container');
        const videoEl = document.getElementById('orbital-bg-video');
        if (!videoEl || !videoContainer) return;

        // Force muted and start playback
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.playsInline = true;
        
        function startVideo() {
          const p = videoEl.play();
          if (p !== undefined) {
            p.catch(function(err) {
              console.log("Video autoplay waiting for interaction:", err);
            });
          }
        }
        startVideo();
        window.addEventListener('click', startVideo, { once: true });
        window.addEventListener('scroll', startVideo, { once: true });
        window.addEventListener('touchstart', startVideo, { once: true });

        // Scroll-driven crossfade
        let ticking = false;
        function updateVideoCrossfade() {
          const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          const homeEl = document.getElementById('home');
          const heroHeight = (homeEl && homeEl.offsetHeight) ? homeEl.offsetHeight : window.innerHeight;
          
          // In hero: opacity is 0.35 (subtle cosmic glow)
          // As you scroll into About: smoothly transitions to 0.88 (full video immersion)
          const transitionDist = Math.max(300, heroHeight * 0.75);
          const p = Math.min(1, Math.max(0, scrollY / transitionDist));
          const smooth = p * p * (3 - 2 * p);
          
          const currentOpacity = 0.35 + (smooth * 0.53); // 0.35 -> 0.88
          videoContainer.style.opacity = currentOpacity.toFixed(3);
          videoContainer.style.transform = 'scale(' + (1.03 - smooth * 0.03).toFixed(3) + ')';
          
          if (homeEl) {
            const canvasEl = homeEl.querySelector('canvas') || homeEl.querySelector('.pointer-events-auto');
            if (canvasEl) {
              const canvasScale = 1 + smooth * 0.35;
              const canvasOpacity = Math.max(0, 1 - smooth * 1.1);
              canvasEl.style.transform = 'scale(' + canvasScale.toFixed(3) + ')';
              canvasEl.style.opacity = canvasOpacity.toFixed(3);
            }
          }
        }

        window.addEventListener('scroll', function() {
          if (!ticking) {
            window.requestAnimationFrame(function() {
              updateVideoCrossfade();
              ticking = false;
            });
            ticking = true;
          }
        }, { passive: true });

        window.addEventListener('resize', updateVideoCrossfade, { passive: true });
        updateVideoCrossfade();
      })();
    </script>

  </body>
