  <head>

    <meta name="theme-color" content="#090a0f" />

    <title>Santo Stark Studio | Systems Developer</title>
    <meta name="description" content="Santo Stark Studio featuring 3D Real Space Solar System, IoT/Cloud projects, skills matrix, and interactive experiences." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  </head>
  <body class="bg-[#090a0f] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden touch-manipulation">
    
    <!-- Orbital Fly-Through Video Backdrop -->
    <div id="orbital-video-container" style="position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; opacity: 0; transform: scale(1.05); will-change: opacity, transform;">
      <video id="orbital-bg-video" autoplay loop muted playsinline preload="auto" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">
        <source src="/bg-video.mp4" type="video/mp4" />
      </video>
      
      <!-- Obsidian Shield (for 100% text readability) -->
      <div style="position: absolute; inset: 0; background: rgba(9, 10, 15, 0.68);"></div>
      
      <!-- Top/Bottom Edge Feathering & Space Horizon Blend -->
      <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, #090a0f 0%, rgba(9, 10, 15, 0.15) 20%, rgba(9, 10, 15, 0.15) 80%, #090a0f 100%);"></div>
      
      <!-- Radial Vignette for Deep Tech Immersion -->
      <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 25%, rgba(9, 10, 15, 0.75) 90%);"></div>
    </div>

    <div id="root" style="position: relative; z-index: 10;"></div>

    <script>
      (function() {
        const videoContainer = document.getElementById('orbital-video-container');
        const videoEl = document.getElementById('orbital-bg-video');
        if (!videoContainer || !videoEl) return;

        // Auto-play safety
        function tryPlayVideo() {
          const playPromise = videoEl.play();
          if (playPromise !== undefined) {
            playPromise.catch(function() {
              window.addEventListener('click', function() { videoEl.play(); }, { once: true });
              window.addEventListener('scroll', function() { videoEl.play(); }, { once: true });
              window.addEventListener('touchstart', function() { videoEl.play(); }, { once: true });
            });
          }
        }
        tryPlayVideo();

        let ticking = false;

        function updateOrbitalCrossfade() {
          const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          const homeEl = document.getElementById('home');
          const heroHeight = (homeEl && homeEl.offsetHeight) ? homeEl.offsetHeight : window.innerHeight;
          
          // Crossfade runs across the first 75% of the hero section
          const transitionDistance = Math.max(300, heroHeight * 0.75);
          const rawProgress = Math.min(1, Math.max(0, scrollY / transitionDistance));
          
          // Smoothstep easing: S-curve for ultra-natural feel
          const smooth = rawProgress * rawProgress * (3 - 2 * rawProgress);
          
          // 1. Video Container: Fades in (0 -> 1) and settles scale gently (1.04 -> 1.0)
          videoContainer.style.opacity = smooth.toFixed(3);
          videoContainer.style.transform = 'scale(' + (1.04 - smooth * 0.04).toFixed(3) + ')';
          
          // 2. Hero 3D Solar System: Dives forward into cosmos and dissolves
          if (homeEl) {
            const canvasEl = homeEl.querySelector('canvas') || homeEl.querySelector('.pointer-events-auto');
            if (canvasEl) {
              const canvasScale = 1 + smooth * 0.38;
              const canvasOpacity = Math.max(0, 1 - smooth * 1.12);
              const canvasBlur = smooth * 5;
              canvasEl.style.transform = 'scale(' + canvasScale.toFixed(3) + ')';
              canvasEl.style.opacity = canvasOpacity.toFixed(3);
              canvasEl.style.filter = 'blur(' + canvasBlur.toFixed(1) + 'px)';
              canvasEl.style.willChange = 'transform, opacity, filter';
            }
          }
        }

        function onScroll() {
          if (!ticking) {
            window.requestAnimationFrame(function() {
              updateOrbitalCrossfade();
              ticking = false;
            });
            ticking = true;
          }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        
        // Initial run
        if (document.readyState === 'complete') {
          updateOrbitalCrossfade();
        } else {
          window.addEventListener('load', updateOrbitalCrossfade);
        }
      })();
    </script>

  </body>
</html>
