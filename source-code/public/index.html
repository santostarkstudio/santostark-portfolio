    <script>
      (function() {
        // Bulletproof scroll-to-section
        window.starkScrollTo = function(targetId) {
          if (!targetId || targetId === 'home' || targetId === '/' || targetId === 'top') {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, '', '/');
            }
            return;
          }
          const el = document.getElementById(targetId);
          if (!el) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          const navOffset = 75;
          const scrollNow = function() {
            const rect = el.getBoundingClientRect();
            const topY = rect.top + window.pageYOffset - navOffset;
            window.scrollTo({ top: Math.max(0, topY), behavior: 'smooth' });
          };
          scrollNow();
          setTimeout(scrollNow, 150);
          setTimeout(scrollNow, 400);
        };
      })();
    </script>

    <script>
      (function() {
        // Scroll-driven crossfade
        let ticking = false;
        function updateVideoCrossfade() {
          const videoContainer = document.getElementById('orbital-video-container');
          if (!videoContainer) return;
          const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          const homeEl = document.getElementById('home');
          const heroHeight = (homeEl && homeEl.offsetHeight) ? homeEl.offsetHeight : window.innerHeight;
          const transitionDist = Math.max(300, heroHeight * 0.75);
          const p = Math.min(1, Math.max(0, scrollY / transitionDist));
          const smooth = p * p * (3 - 2 * p);
          const currentOpacity = 0.22 + (smooth * 0.38);
          videoContainer.style.opacity = currentOpacity.toFixed(3);
          videoContainer.style.transform = 'scale(' + (1.03 - smooth * 0.03).toFixed(3) + ')';
          if (homeEl) {
            const canvasEl = homeEl.querySelector('canvas') || homeEl.querySelector('.pointer-events-auto');
            if (canvasEl) {
              const canvasOpacity = Math.max(0, 1 - smooth * 1.1);
              canvasEl.style.transform = 'none';
              canvasEl.style.opacity = canvasOpacity.toFixed(3);
            }
          }
        }
        window.addEventListener('scroll', function() {
          if (!ticking) {
            window.requestAnimationFrame(function() { updateVideoCrossfade(); ticking = false; });
            ticking = true;
          }
        }, { passive: true });
        window.addEventListener('resize', updateVideoCrossfade, { passive: true });
        updateVideoCrossfade();
      })();
    </script>

    <script>
      (function() {
        /* ===== CLEAN IMAGE VIEWER â€” for gallery, photos, logo, profile pics ===== */
        function openImageInNewTab(url, title) {
          if (!url) return;
          title = title || 'Santo Stark Studio';
          var safeTitle = (title + '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
          var win = window.open('', '_blank');
          if (!win) { alert('Please allow popups to view this image.'); return; }
          win.document.open();
          win.document.write(
            '<!DOCTYPE html><html lang="en"><head>' +
            '<meta charset="UTF-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1.0">' +

              'img.zoomed{cursor:zoom-out;transform:scale(1.45);}' +
            '</style></head><body>' +
            '<img src="' + url + '" alt="' + safeTitle + '" onclick="this.classList.toggle(\'zoomed\')" />' +
            '</body></html>'
          );
          win.document.close();
        }

        /* ===== SMART PDF / DOCX / CERTIFICATE VIEWER ===== */
        function openDocumentInNewTab(url, title) {
          if (!url) return;
          title = title || 'Verified Document';

          /* 1. Image Certificates (.png, .jpg, .webp, or base64 image) */
          var isImage = /\.(png|jpe?g|webp|svg|gif)(\?|$)/i.test(url) ||
                        (url.startsWith('data:image/') && !url.startsWith('data:image/pdf'));
          if (isImage) {
            openImageInNewTab(url, title);
            return;
          }

          /* 2. Base64 Uploaded PDFs (Blob URL -> opens Chrome/Edge native Google PDF viewer) */
          var isBase64Pdf = url.startsWith('data:application/pdf') || 
                            url.startsWith('data:application/octet-stream;base64,JVBERi') ||
                            url.includes('JVBERi0') ||
                            url.startsWith('%PDF');
          if (isBase64Pdf) {
            try {
              var c = url;
              if (c.indexOf(',') !== -1) c = c.split(',')[1];
              c = c.replace(/\s/g, '');
              var bin = atob(c);
              var u = new Uint8Array(bin.length);
              for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
              var blob = new Blob([u], { type: 'application/pdf' });
              var blobUrl = URL.createObjectURL(blob);
              window.open(blobUrl, '_blank');
              return;
            } catch(e) {
              console.warn('Blob PDF conversion fallback:', e);
            }
          }

          /* 3. Online PDFs or Word DOCX / DOC / PPTX -> Official Google Docs Viewer */
          var isOfficeDoc = /\.(docx?|pptx?|xlsx?)(\?|$)/i.test(url);
          var isOnlinePdf = /\.pdf(\?|$)/i.test(url) || url.includes('/pdf');
          if (isOfficeDoc || isOnlinePdf) {
            if (url.startsWith('http://') || url.startsWith('https://')) {
              var gview = 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=false';
              window.open(gview, '_blank', 'noopener');
              return;
            }
          }

          /* 4. Any online verification webpage (Coursera, Credly, SkillFront, IEEE, etc.) */
          window.open(url, '_blank', 'noopener');
        }

        /* ===== DEDICATED PROJECT OVERVIEW IN NEW TAB ===== */
        function openProjectViewInNewTab(project) {
          if (!project) return;
          try {
            sessionStorage.setItem('stark_current_project', JSON.stringify(project));
            localStorage.setItem('stark_current_project', JSON.stringify(project));
          } catch(e) {}
          var id = (typeof project === 'object') ? (project.id || project.title) : project;
          window.open('/project-view.html?id=' + encodeURIComponent(id), '_blank');
        }

        /* Expose globals */
        window.openImageInNewTab       = openImageInNewTab;    /* gallery, photos, logo */
        window.openInNewTab            = openImageInNewTab;    /* legacy alias */
        window.openCertificateInNewTab = openDocumentInNewTab; /* PDFs only */
        window.openDocumentInNewTab    = openDocumentInNewTab; /* PDFs only */
        window.openProjectViewInNewTab = openProjectViewInNewTab; /* Dedicated Project Tab */
        window.openProjectView         = openProjectViewInNewTab;
      })();
    </script>
